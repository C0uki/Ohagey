name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# docs/roadmap.md 参照。engine/・tsf/・settings-app/ のロジック・installer/ の
# 4つが実際に回っている。CI で検証できない部分は各ジョブのコメントに書いてある
# (TSF の登録には管理者権限、設定アプリの WinUI 本体には Visual Studio が要る)。

permissions:
  contents: read

jobs:
  # 決定 0008 / 0009 / 0016 の担保:
  # Zenzai モデル (CC-BY-SA 4.0) を含むあらゆるモデル重みをリポジトリに
  # コミットしていないことを CI で保証する。
  no-committed-model:
    name: Guard — no model weights committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if model weights are tracked
        run: |
          set -euo pipefail
          hits="$(git ls-files -- '*.gguf' '*.safetensors' '*.bin' 'models/**' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Model weight file(s) committed — forbidden by decisions 0008/0009/0016:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no model weight files tracked."

  # エンジン (Swift, 決定 0005 / 0020)。
  #
  # Zenzai trait が有効なので llama.cpp のリンクが必要で、`swift test` は
  # パッケージ全体をビルドする（＝ライブラリのテストだけを llama.cpp 抜きで
  # 回すことはできない）。
  #
  # llama.cpp は**ビルドせず、azooKey/llama.cpp のリリースから取る**
  # (tools/fetch-backends.ps1)。理由は2つあり、2つ目の方が重い:
  #
  #   1. 速い。cmake で 10 分以上かけていたものが 17MB のダウンロードになり、
  #      キャッシュも要らなくなる。
  #   2. **fork が正しくなる。** ここは以前 ggml-org/llama.cpp をビルドしていたが、
  #      upstream には zenz モデルが要る日本語プレトークナイザ
  #      (`gpt2-small-japanese-char`) が無い。リンクも起動も変換も通り、
  #      ただ Zenzai だけが黙って無効になる（決定 0034 で実機で踏んだ）。
  #      CI にモデルは無いのでここでは表面化しないが、正しくない物を基準に
  #      ビルドを緑にしても意味がない。
  #
  # llama.cpp のバージョンは AzooKeyKanaKanjiConverter と独立には動かせない
  # （決定 0028）。ここを変えるときは engine/Package.swift の pin も必ず一緒に
  # 確認すること。
  engine:
    name: engine — swift build & test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # AzooKeyKanaKanjiConverter のサブモジュールはパスが深く、260 文字制限に
      # 当たることがある（docs/local-setup.md 参照）。
      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # docs/local-setup.md の「動作確認済みの組み合わせ」に合わせる。
      # 6.1.2 では Windows SDK 10.0.26100 のヘッダに対して
      # `could not build module 'std'` になり、C++ interop（Zenzai）が通らない。
      # ツールチェーンと SDK の組み合わせは実際に確認したものだけを使うこと。
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE

      - name: Fetch llama.cpp backends
        run: ./tools/fetch-backends.ps1 -Backends cpu

      # LIB はリンク時（llama.lib）、PATH は実行時（llama.dll）。
      # どちらか一方では足りない。テスト自体は Zenzai を触らないが、
      # 実行可能ターゲットのリンクと起動は通る必要がある。
      - name: Build and test
        working-directory: engine
        run: |
          $backends = "${{ github.workspace }}\backends"
          $env:LIB = "$backends;$env:LIB"
          $env:PATH = "$backends\cpu;$env:PATH"
          swift build
          swift test

      # Release as well as debug, because the installer packages the release
      # binary and the installer job below needs it to exist. Also the only
      # place the release configuration is compiled at all: debug and release
      # differ in more than optimisation here — EnginePaths honours
      # OHAGEY_MODEL_PATH and OHAGEY_BASE_LM_PATH in debug only, so a
      # release-only compile error would otherwise reach a machine first.
      - name: Build the release engine
        working-directory: engine
        run: |
          $backends = "${{ github.workspace }}\backends"
          $env:LIB = "$backends;$env:LIB"
          $env:PATH = "$backends\cpu;$env:PATH"
          swift build -c release

      # The architecture triple, not .build\release: SwiftPM makes the latter a
      # symbolic link, and creating one needs Developer Mode or elevation. It
      # fails on an ordinary machine with I/O error 512 and leaves nothing
      # behind, which is why ohagey.iss names the triple too (decision 0033).
      - uses: actions/upload-artifact@v4
        with:
          name: engine-release
          path: engine/.build/x86_64-unknown-windows-msvc/release/OhageyEngine.exe
          if-no-files-found: error

  # TSF テキストサービス (C++ / MSBuild, 決定 0002 / 0003 / 0018 / 0020)。
  #
  # MSBuild は決定 0020 の連携ターゲット経由で `swift build` も呼ぶため
  # llama.cpp が要る。以前は engine ジョブが llama.cpp をビルドしてキャッシュに
  # 入れるのを待っていた（`needs: engine`）が、ビルドをやめてダウンロードにした
  # ので待つ理由が無くなり、engine と並列に走る。
  #
  # ここで engine のビルドを切らずに通しているのは、**連携そのものを検証する**ため。
  # 誰も実行しないビルド統合は壊れたまま気づかれない。
  tsf:
    name: tsf — MSBuild x64 (+ engine 連携)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE

      - name: Fetch llama.cpp backends
        run: ./tools/fetch-backends.ps1 -Backends cpu

      - name: Build (Debug and Release)
        working-directory: tsf/SampleIME
        run: |
          $llama = "${{ github.workspace }}\backends"

          # swift.exe by absolute path rather than trusting PATH. MSBuild's Exec
          # goes through cmd.exe, and on this runner the Swift toolchain — added
          # to a PATH that is already long — is not visible by the time cmd
          # looks. The engine job does not hit this because it calls swift from
          # pwsh directly.
          $swift = (Get-Command swift -ErrorAction SilentlyContinue)?.Source
          if (-not $swift) { throw "swift.exe not found; the Swift setup step did not take" }
          Write-Host "swift: $swift"

          # LIB as the Swift setup left it, handed to the engine build so it
          # links against the same MSVC its clang compiled with. MSBuild
          # otherwise replaces LIB with the toolset it picked for the C++
          # project, and this runner has more than one installed — the mismatch
          # surfaces as `lld-link: error: undefined symbol: __std_rotate`, an
          # STL helper the headers call and the other toolset's msvcprt.lib
          # does not export. See tsf/Ohagey.Engine.targets.
          # Semicolons escaped: msbuild splits /p: values on ';' and would read
          # a path list as several properties (MSB1006). It unescapes %3B when
          # the property is expanded, so the targets file sees the real value.
          $swiftLib = $env:LIB -replace ';', '%3B'
          Write-Host "LIB (Swift): $env:LIB"

          foreach ($config in @("Debug", "Release")) {
            msbuild SampleIME.vcxproj /t:Rebuild `
              /p:Configuration=$config /p:Platform=x64 `
              /p:OhageyLlamaLibDir="$llama" `
              /p:OhageySwiftExe="$swift" `
              /p:OhageySwiftLib="$swiftLib" `
              /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "$config build failed" }
          }

      # 実際に IME として動かすには TSF への登録（管理者権限）が要るので、CI で
      # 検証できるのはここまで。DLL が出来て COM のエクスポートが揃っていること。
      - name: Check the DLL exports
        working-directory: tsf/SampleIME
        run: |
          # Joined into one string on purpose. dumpbin returns an array of
          # lines, and `-notmatch` against an array filters it — returning every
          # line that does not match, which is almost all of them and therefore
          # truthy. The check then fails whether or not the export is there.
          # OhageyTSF.dll, not SampleIME.dll: the project keeps the vendored
          # name but the artefact is the shipping one (決定 0033). Asserted
          # rather than globbed so a TargetName that silently stopped applying
          # fails here instead of shipping under the sample's name.
          $dll = "x64\Release\OhageyTSF.dll"
          if (-not (Test-Path $dll)) { throw "expected $dll; found: $((Get-ChildItem x64\Release -Filter *.dll).Name -join ', ')" }

          # Joined into one string on purpose. dumpbin returns an array of
          # lines, and `-notmatch` against an array filters it — returning every
          # line that does not match, which is almost all of them and therefore
          # truthy. The check then fails whether or not the export is there.
          $exports = (dumpbin /exports $dll) -join "`n"
          foreach ($name in @("DllGetClassObject", "DllCanUnloadNow", "DllRegisterServer", "DllUnregisterServer")) {
            if ($exports -notmatch $name) { throw "missing export: $name" }
          }
          Write-Host "all four COM exports present"

      - uses: actions/upload-artifact@v4
        with:
          name: tsf-release
          path: tsf/SampleIME/x64/Release/OhageyTSF.dll
          if-no-files-found: error

  # 設定アプリのロジック部分（決定 0013 / 0035 / 0036）。
  #
  # UI ではなくロジックだけを見るジョブ。設定スキーマと辞書フォーマットは
  # Swift 側と C# 側の二重実装なので、食い違うと「設定を変えても何も起きない」
  # という壊れ方をする。それを落とすためのテストがここで走る。
  #
  # WinUI 本体はまだ含まれていない。デスクトップの要る部分は CI では検証できず、
  # ここで守れるのは検証できる部分だけ。
  settings-app:
    name: settings-app — logic build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        working-directory: settings-app
        run: |
          dotnet test tests/Ohagey.Settings.Core.Tests/Ohagey.Settings.Core.Tests.csproj `
            -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "settings-app tests failed" }

  # インストーラ (Inno Setup, 決定 0019 / 0033)。
  #
  # ここで守っているのは **[Files] のソースパスが実物と一致すること** である。
  # 決定 0033 で、誰も iscc を通していなかった間に **3件中2件が間違っていた**
  # (エンジンは作成に失敗するシンボリックリンクを指し、設定アプリは exe 1つだけを
  # 入れていて起動できない構成だった)。パスの間違いはビルドを壊さないので、
  # 実際にパッケージするまで誰も気づかない。
  #
  # engine と tsf の成果物は各ジョブから artifact で受け取る。ここで組み直すと
  # llama.cpp の取得と MSBuild をもう一度やることになり、しかも
  # **CI がパッケージするものと CI がテストしたものが別物になる**。
  #
  # ── 設定アプリだけは検証できない ──
  #
  # WinUI 3 の PRI 生成タスクは Visual Studio 側にしかなく、`dotnet build` では
  # 建たない (docs/local-setup.md)。その1行だけを `/DSkipSettingsApp` で外す。
  # **残り4つのソースパスは本物の成果物に対して検証される。**
  # 設定アプリの TFM / RID / プロジェクト配置を変えたときは手で確認すること。
  installer:
    name: installer — iscc (パスの実物突き合わせ)
    runs-on: windows-latest
    needs: [engine, tsf]
    steps:
      - uses: actions/checkout@v4

      # ohagey.iss は成果物を相対パスで参照する (`..\engine\.build\...`)。
      # artifact をそのパスへ展開すれば、スクリプト側に CI 用の分岐が要らない。
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: engine/.build/x86_64-unknown-windows-msvc/release

      - uses: actions/download-artifact@v4
        with:
          name: tsf-release
          path: tsf/SampleIME/x64/Release

      # backends\cpu\*.dll も [Files] に入っている。GPU バックエンドは
      # /DGpuBackends を渡さない限り参照されないので取らない。
      - name: Fetch llama.cpp backends
        run: ./tools/fetch-backends.ps1 -Backends cpu

      # winget はランナーで使えないことがあるので、リリース資産を直接取る。
      # バージョンを固定するのは、手元で通したのと同じコンパイラで通すため
      # (6.7.3 — 決定 0033)。
      - name: Install Inno Setup
        run: |
          $url = "https://files.jrsoftware.org/is/6/innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile the installer
        run: |
          # 展開した成果物が本当にそこにあるかを先に言う。iscc の
          # "Source file not found" だけでは、パスが間違っているのか
          # artifact が来ていないのかが分からない。
          foreach ($path in @(
            "engine\.build\x86_64-unknown-windows-msvc\release\OhageyEngine.exe",
            "tsf\SampleIME\x64\Release\OhageyTSF.dll")) {
            if (-not (Test-Path $path)) { throw "artifact missing: $path" }
            Write-Host "have $path"
          }
          & $env:ISCC /DSkipSettingsApp installer\ohagey.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      # 設定アプリを抜いてあるので配布物ではない。**インストールしてはいけない。**
      # 中身を見たいとき (どのファイルが入ったか) のために残す。
      - uses: actions/upload-artifact@v4
        with:
          name: installer-without-settings-app
          path: installer/Output/ohagey-setup.exe
          if-no-files-found: error
