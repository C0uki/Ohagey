name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# docs/roadmap.md 参照。engine/ はフェーズ1でビルド・テストが通るようになったので
# 有効化済み。tsf/・settings-app/ はまだ雛形のため、定義だけ用意してある。

permissions:
  contents: read

jobs:
  # 決定 0008 / 0009 / 0016 の担保:
  # Zenzai モデル (CC-BY-SA 4.0) を含むあらゆるモデル重みをリポジトリに
  # コミットしていないことを CI で保証する。
  no-committed-model:
    name: Guard — no model weights committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if model weights are tracked
        run: |
          set -euo pipefail
          hits="$(git ls-files -- '*.gguf' '*.safetensors' '*.bin' 'models/**' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Model weight file(s) committed — forbidden by decisions 0008/0009/0016:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no model weight files tracked."

  # エンジン (Swift, 決定 0005 / 0020)。
  #
  # Zenzai trait が有効なので llama.cpp のリンクが必要で、`swift test` は
  # パッケージ全体をビルドする（＝ライブラリのテストだけを llama.cpp 抜きで
  # 回すことはできない）。そのため llama.cpp をここでビルドしてキャッシュする。
  #
  # llama.cpp のバージョンは AzooKeyKanaKanjiConverter と独立には動かせない
  # （決定 0028）。ここを変えるときは engine/Package.swift の pin も必ず一緒に
  # 確認すること。キャッシュキーもこのバージョンで切ってある。
  engine:
    name: engine — swift build & test (Windows x64)
    runs-on: windows-latest
    env:
      LLAMA_CPP_TAG: b4846
    steps:
      - uses: actions/checkout@v4

      # AzooKeyKanaKanjiConverter のサブモジュールはパスが深く、260 文字制限に
      # 当たることがある（docs/local-setup.md 参照）。
      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # docs/local-setup.md の「動作確認済みの組み合わせ」に合わせる。
      # 6.1.2 では Windows SDK 10.0.26100 のヘッダに対して
      # `could not build module 'std'` になり、C++ interop（Zenzai）が通らない。
      # ツールチェーンと SDK の組み合わせは実際に確認したものだけを使うこと。
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE

      - name: Cache llama.cpp
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp/build-${{ env.LLAMA_CPP_TAG }}
          key: llama-cpp-${{ env.LLAMA_CPP_TAG }}-windows-x64-shared

      - name: Build llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:LLAMA_CPP_TAG https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          # BUILD_SHARED_LIBS=ON で llama.lib / llama.dll を出す（決定 0028）。
          cmake -B build-$env:LLAMA_CPP_TAG -DBUILD_SHARED_LIBS=ON
          cmake --build build-$env:LLAMA_CPP_TAG --config Release

      # LIB はリンク時（llama.lib）、PATH は実行時（llama.dll）。
      # どちらか一方では足りない。
      - name: Build and test
        working-directory: engine
        run: |
          $llama = "${{ github.workspace }}\llama.cpp\build-$env:LLAMA_CPP_TAG"
          $env:LIB = "$llama\src\Release;$env:LIB"
          $env:PATH = "$llama\bin\Release;$env:PATH"
          swift build
          swift test

  # TSF テキストサービス (C++ / MSBuild, 決定 0002 / 0003 / 0018 / 0020)。
  #
  # engine ジョブの後に走らせる。MSBuild は決定 0020 の連携ターゲット経由で
  # `swift build` も呼ぶため llama.cpp が要るが、engine ジョブが同じキーで
  # キャッシュを温めてくれる。並列にすると初回に llama.cpp を2回ビルドすることに
  # なるので、待つ方を選んだ。
  #
  # ここで engine のビルドを切らずに通しているのは、**連携そのものを検証する**ため。
  # 誰も実行しないビルド統合は壊れたまま気づかれない。
  tsf:
    name: tsf — MSBuild x64 (+ engine 連携)
    runs-on: windows-latest
    needs: engine
    env:
      LLAMA_CPP_TAG: b4846
    steps:
      - uses: actions/checkout@v4

      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE

      # engine ジョブが保存済み。ここではミスするはずがないが、するなら
      # llama.cpp をビルドし直すのではなく落としたい（同じものを2度ビルドしても
      # 得るものが無い）。
      - name: Restore llama.cpp
        id: cache-llama
        uses: actions/cache/restore@v4
        with:
          path: llama.cpp/build-${{ env.LLAMA_CPP_TAG }}
          key: llama-cpp-${{ env.LLAMA_CPP_TAG }}-windows-x64-shared

      - name: Fail if llama.cpp was not cached
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          Write-Error "llama.cpp のキャッシュが見つからない。engine ジョブが保存に失敗している可能性がある"
          exit 1

      - name: Build (Debug and Release)
        working-directory: tsf/SampleIME
        run: |
          $llama = "${{ github.workspace }}\llama.cpp\build-$env:LLAMA_CPP_TAG\src\Release"

          # swift.exe by absolute path rather than trusting PATH. MSBuild's Exec
          # goes through cmd.exe, and on this runner the Swift toolchain — added
          # to a PATH that is already long — is not visible by the time cmd
          # looks. The engine job does not hit this because it calls swift from
          # pwsh directly.
          $swift = (Get-Command swift -ErrorAction SilentlyContinue)?.Source
          if (-not $swift) { throw "swift.exe not found; the Swift setup step did not take" }
          Write-Host "swift: $swift"

          foreach ($config in @("Debug", "Release")) {
            msbuild SampleIME.vcxproj /t:Rebuild `
              /p:Configuration=$config /p:Platform=x64 `
              /p:OhageyLlamaLibDir="$llama" `
              /p:OhageySwiftExe="$swift" `
              /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "$config build failed" }
          }

      # 実際に IME として動かすには TSF への登録（管理者権限）が要るので、CI で
      # 検証できるのはここまで。DLL が出来て COM のエクスポートが揃っていること。
      - name: Check the DLL exports
        working-directory: tsf/SampleIME
        run: |
          # Joined into one string on purpose. dumpbin returns an array of
          # lines, and `-notmatch` against an array filters it — returning every
          # line that does not match, which is almost all of them and therefore
          # truthy. The check then fails whether or not the export is there.
          $exports = (dumpbin /exports x64\Release\SampleIME.dll) -join "`n"
          foreach ($name in @("DllGetClassObject", "DllCanUnloadNow", "DllRegisterServer", "DllUnregisterServer")) {
            if ($exports -notmatch $name) { throw "missing export: $name" }
          }
          Write-Host "all four COM exports present"

  # ── 今後有効化する実ビルドジョブ（コンポーネント実装後にコメント解除）──
  #
  # installer (Inno Setup, 決定 0019):
  #   runs-on: windows-latest。`iscc installer/ohagey.iss`。
  #   tsf/engine/settings-app が実ビルド成果物を出すようになったら有効化。
